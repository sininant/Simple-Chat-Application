[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[project]
name = "simple-chat-application"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "customtkinter>=5.2.2,<6.0.0",
    "pillow>=10.0.0,<13.0.0",
    "python-socketio>=5.11.0,<6.0.0",
    "requests>=2.31.0,<3.0.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
